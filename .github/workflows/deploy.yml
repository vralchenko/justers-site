name: Deploy to MiroHost

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /justers.com.ua/
          exclude: |
            **/.git*
            **/.git*/**
            **/.idea/**
            **/.DS_Store
            **/README.md
            **/_headers
            **/package.json
            **/package-lock.json
            **/node_modules/**
            **/.github/**
            **/.claude/**
            **/.env
            **/CLAUDE.md
