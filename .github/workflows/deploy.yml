name: Deploy to MiroHost via FTP

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /justers.com.ua/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .claude/**
            .github/**
            package.json
            package-lock.json
            wrangler.toml
            CLAUDE.md
            MIGRATION.md
